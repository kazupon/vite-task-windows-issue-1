name: CI

env:
  CI: true
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    name: Lint (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: 22.13
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Print Vite+ version
        run: vp --version

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build packages
        run: vp run -r build

      - name: Check
        run: vpr check

  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: 22.13
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.96.0"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Print Vite+ version
        run: vp --version

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build packages
        run: vpr build

      - name: Testing
        if: runner.os != 'Windows'
        env:
          VITE_LOG: vite_task=trace
        run: vpr -v test

      - name: Testing (Windows with process snapshots)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VITE_LOG: vite_task=trace
        run: |
          $ErrorActionPreference = "Stop"
          $dumpScript = @'
          $ErrorActionPreference = "Continue"

          for ($i = 1; $i -le 3; $i++) {
            Start-Sleep -Seconds 60

            Write-Host "::group::Process snapshot after $($i * 60)s"
            Get-Date -Format o
            Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -match "vp|vpr|node|cargo|rust|vitest|powershell|pwsh" } |
              Sort-Object Name, ProcessId |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine |
              Format-List
            Write-Host "::endgroup::"
          }
          '@

          $encodedDumpScript = [Convert]::ToBase64String(
            [System.Text.Encoding]::Unicode.GetBytes($dumpScript)
          )
          $dump = Start-Process pwsh `
            -ArgumentList "-NoLogo", "-NoProfile", "-EncodedCommand", $encodedDumpScript `
            -NoNewWindow `
            -PassThru

          try {
            vpr -v test
            $exitCode = $LASTEXITCODE
            if ($null -eq $exitCode) {
              $exitCode = 0
            }
          }
          finally {
            if ($dump -and -not $dump.HasExited) {
              Stop-Process -Id $dump.Id -Force -ErrorAction SilentlyContinue
            }
          }

          exit $exitCode

  test-no-cache:
    runs-on: windows-latest
    name: Test no-cache (windows-latest)
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: 22.13
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.96.0"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Print Vite+ version
        run: vp --version

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build packages
        run: vpr build

      - name: Testing without Vite Task cache
        env:
          VITE_LOG: vite_task=trace
        run: vpr --no-cache -v test
